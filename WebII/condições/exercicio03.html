<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parquímetro JS</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col">

                <h1>Programa Parquímetro</h1>

                <form id="form">
                    <p>
                        Valor R$:
                        <input type="number" id="inValor" min="0" step="0.01" required>
                    </p>

                    <input type="submit" value="Confirmar Depósito"
                           class="btn btn-warning">
                </form>

                <h3 id="outTempo"></h3>
                <h3 id="outTroco"></h3>
                <h3 id="outMensagem"></h3>

            </div>
        </div>
    </div>

    <script src="js/ex04c.js"></script>
</body>
</html>
