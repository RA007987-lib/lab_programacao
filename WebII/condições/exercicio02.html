<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifica Velocidade JS</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col">

                <h1>Programa Verifica Velocidade</h1>

                <form id="form">

                    <p>
                        Velocidade Permitida:
                        <input type="number" id="inPermitida" required>
                    </p>

                    <p>
                        Velocidade do Condutor:
                        <input type="number" id="inCondutor" required>
                    </p>

                    <input type="submit" value="Verificar Velocidade"
                           class="btn btn-warning">

                </form>

                <h3 id="outSituacao"></h3>

            </div>
        </div>
    </div>

    <script src="js/ex04b.js"></script>
</body>
</html>
