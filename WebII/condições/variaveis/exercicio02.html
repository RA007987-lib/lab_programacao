<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lan House JS</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col">

                <h1>Lan House JS</h1>

                <form id="form">
                    <p>
                        Valor por 15min de Uso R$:
                        <input type="number" id="inValor" min="0" step="0.01" required>
                    </p>

                    <p>
                        Tempo de Uso do Cliente:
                        <input type="number" id="inTempo" min="0" required>
                    </p>

                    <input type="submit" value="Calcular Valor a Pagar"
                           class="btn btn-warning">
                </form>

                <h3 id="outValor"></h3>

            </div>
        </div>
    </div>

    <script src="js/ex02b.js"></script>
</body>
</html>
